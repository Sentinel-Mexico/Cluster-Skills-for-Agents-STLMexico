name: Validate SKILL.md
on:
  push:
    paths:
      - 'templates/**'
      - 'skills/**'
      - 'scripts/**'
      - '.github/workflows/validate-skill.yml'
  pull_request:
    paths:
      - 'templates/**'
      - 'skills/**'
      - 'scripts/**'
      - '.github/workflows/validate-skill.yml'

jobs:
  validate:
    name: Agent Skills Conformance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Validation Engine
        run: |
          chmod +x ./scripts/validate-skills.sh
          ./scripts/validate-skills.sh
