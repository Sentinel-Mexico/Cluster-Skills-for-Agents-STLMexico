name: Security & Integrity Scan
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  secret-scan:
    name: Gitleaks Secret Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

  integrity-scan:
    name: Code & Script Integrity Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck on Bash scripts
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            find . -type f -name "*.sh" -exec shellcheck {} +
          else
            echo "Shellcheck not preinstalled, running basic syntax check..."
            bash -n scripts/install-skill.sh
            bash -n scripts/validate-skills.sh
          fi
