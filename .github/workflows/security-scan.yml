name: Security Scan
on:
  push:
    paths:
      - '**/*'
  pull_request:
    paths:
      - '**/*'
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml
      - name: Dependency check (placeholder)
        run: echo "No dependency scan configured yet"
